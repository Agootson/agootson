
<script>
(function () {
  "use strict";

  const mount = document.querySelector("#advancedPanel .advanced-grid");
  if (!mount || document.getElementById("publisherPowerTools")) return;

  const card = document.createElement("article");
  card.className = "advanced-card tool-card-wide";
  card.id = "publisherPowerTools";

  card.innerHTML = `
    <div class="tool-icon"><i class="fa-solid fa-wand-magic-sparkles"></i></div>
    <h3>Publisher Power Tools</h3>
    <p>Advanced publishing, quality checks, planning and recovery tools.</p>

    <div class="power-tool-grid">

      <section class="power-tool-box">
        <h4>Live Writing Statistics</h4>
        <div class="power-stats">
          <div><b id="ptWords">0</b><span>Words</span></div>
          <div><b id="ptMinutes">0 min</b><span>Reading time</span></div>
          <div><b id="ptTitleCount">0/70</b><span>Title length</span></div>
          <div><b id="ptExcerptCount">0/160</b><span>Excerpt length</span></div>
        </div>
        <button class="btn secondary" id="ptRefreshStats" type="button">Refresh statistics</button>
        <button class="btn secondary" id="ptFocusEditor" type="button">Focus editor</button>
      </section>

      <section class="power-tool-box">
        <h4>Pre-Publish Checklist</h4>
        <label><input type="checkbox" data-pt-check="title"> Descriptive title</label>
        <label><input type="checkbox" data-pt-check="excerpt"> Excerpt completed</label>
        <label><input type="checkbox" data-pt-check="image"> Cover image checked</label>
        <label><input type="checkbox" data-pt-check="links"> Links checked</label>
        <label><input type="checkbox" data-pt-check="proof"> Proofread and previewed</label>
        <div id="ptChecklistStatus" class="advanced-result">0 of 5 completed.</div>
      </section>

      <section class="power-tool-box">
        <h4>Content Planner</h4>
        <label for="ptPlanDate">Target date</label>
        <input id="ptPlanDate" type="date">

        <label for="ptPlanTitle">Planned article or task</label>
        <input id="ptPlanTitle" maxlength="180" placeholder="e.g. Publish project update">

        <label for="ptPlanNote">Notes</label>
        <textarea id="ptPlanNote" rows="3" placeholder="Outline, links, next steps..."></textarea>

        <button class="btn" id="ptAddPlan" type="button">Add to planner</button>
        <button class="btn secondary" id="ptExportPlan" type="button">Export planner</button>
        <div id="ptPlanList" class="advanced-list"></div>
      </section>

      <section class="power-tool-box">
        <h4>Publishing Diagnostics</h4>
        <p>Check for common article problems before publishing.</p>
        <button class="btn" id="ptRunDiagnostics" type="button">Run diagnostics</button>
        <button class="btn secondary" id="ptCopyReport" type="button">Copy report</button>
        <div id="ptDiagnosticsResult" class="advanced-result">No diagnostics run yet.</div>
      </section>

      <section class="power-tool-box">
        <h4>Backup Inspector</h4>
        <p>Validate a JSON backup without changing your database.</p>
        <input type="file" id="ptBackupFile" accept=".json,application/json">
        <div id="ptBackupResult" class="advanced-result">No file selected.</div>
      </section>

      <section class="power-tool-box">
        <h4>Cover Image Preview</h4>
        <label for="ptImageUrl">Image URL</label>
        <input id="ptImageUrl" type="url" placeholder="https://example.com/cover.jpg">
        <button class="btn secondary" id="ptPreviewImage" type="button">Preview image</button>
        <button class="btn secondary" id="ptUseCover" type="button">Use in article</button>
        <div id="ptImagePreview" class="pt-image-preview">Image preview appears here.</div>
      </section>

      <section class="power-tool-box">
        <h4>Recovery and Workflow</h4>
        <p>Save a local recovery copy of your current article.</p>
        <button class="btn secondary" id="ptSaveRecovery" type="button">Save recovery copy</button>
        <button class="btn secondary" id="ptExportChecklist" type="button">Export checklist</button>
        <div id="ptWorkflowStatus" class="advanced-result">Recovery copies stay in this browser.</div>
      </section>

    </div>
  `;

  mount.appendChild(card);

  const style = document.createElement("style");
  style.textContent = `
    #publisherPowerTools .power-tool-grid {
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
      margin-top:16px;
    }

    #publisherPowerTools .power-tool-box {
      border:1px solid var(--line,#e7e9ed);
      border-radius:12px;
      padding:14px;
      min-width:0;
      background:var(--white,#fff);
    }

    #publisherPowerTools .power-tool-box h4 {
      margin:0 0 12px;
    }

    #publisherPowerTools .power-tool-box label {
      display:block;
      margin:9px 0;
    }

    #publisherPowerTools .power-tool-box input:not([type=checkbox]):not([type=file]),
    #publisherPowerTools .power-tool-box textarea {
      width:100%;
      padding:10px;
      border:1px solid var(--line,#e7e9ed);
      border-radius:8px;
      background:var(--bg,#f7f8fa);
      color:var(--text,#20242a);
    }

    #publisherPowerTools .power-stats {
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:8px;
      margin-bottom:12px;
    }

    #publisherPowerTools .power-stats div {
      background:var(--bg,#f7f8fa);
      padding:10px;
      border-radius:8px;
      display:flex;
      flex-direction:column;
      gap:4px;
      overflow-wrap:anywhere;
    }

    #publisherPowerTools .power-stats b {
      color:var(--red,#e31b23);
      font-size:1.1rem;
    }

    #publisherPowerTools .power-stats span {
      font-size:.75rem;
      color:var(--muted,#747b86);
    }

    #publisherPowerTools .pt-plan-item {
      border:1px solid var(--line,#e7e9ed);
      border-radius:8px;
      padding:10px;
      margin-top:8px;
      overflow-wrap:anywhere;
    }

    #publisherPowerTools .pt-image-preview {
      margin-top:10px;
      min-height:80px;
      border:1px dashed var(--line,#e7e9ed);
      border-radius:8px;
      padding:10px;
      display:grid;
      place-items:center;
      overflow:hidden;
    }

    #publisherPowerTools .pt-image-preview img {
      max-width:100%;
      max-height:260px;
      object-fit:contain;
    }

    @media(max-width:760px) {
      #publisherPowerTools .power-tool-grid {
        grid-template-columns:1fr;
      }
      #publisherPowerTools .power-stats {
        grid-template-columns:repeat(2,minmax(0,1fr));
      }
    }
  `;
  document.head.appendChild(style);

  const $ = id => document.getElementById(id);
  const PLAN_KEY = "agootson_publisher_planner_v1";
  const CHECK_KEY = "agootson_publisher_checklist_v1";
  let lastReport = "";

  function esc(value) {
    return String(value ?? "").replace(/[&<>"']/g, c => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    })[c]);
  }

  function plainText(html) {
    const el = document.createElement("div");
    el.innerHTML = html || "";
    return (el.textContent || el.innerText || "")
      .replace(/\s+/g, " ")
      .trim();
  }

  function editorData() {
    return {
      title: $("blogTitle")?.value?.trim() || "",
      excerpt: $("blogExcerpt")?.value?.trim() || "",
      content: $("blogContent")?.value || "",
      cover: $("blogCover")?.value?.trim() || ""
    };
  }

  function updateStats() {
    const a = editorData();
    const words = plainText(a.content).split(/\s+/).filter(Boolean).length;

    $("ptWords").textContent = words;
    $("ptMinutes").textContent = Math.max(1, Math.ceil(words / 220)) + " min";
    $("ptTitleCount").textContent = a.title.length + "/70";
    $("ptExcerptCount").textContent = a.excerpt.length + "/160";
  }

  function checklistUpdate() {
    const boxes = [...card.querySelectorAll("[data-pt-check]")];
    const count = boxes.filter(x => x.checked).length;

    $("ptChecklistStatus").textContent =
      `${count} of ${boxes.length} checks completed.`;

    localStorage.setItem(
      CHECK_KEY,
      JSON.stringify(boxes.map(x => [x.dataset.ptCheck, x.checked]))
    );
  }

  function plans() {
    try {
      const data = JSON.parse(localStorage.getItem(PLAN_KEY) || "[]");
      return Array.isArray(data) ? data : [];
    } catch {
      return [];
    }
  }

  function renderPlans() {
    const items = plans().sort((a,b) =>
      (a.date || "").localeCompare(b.date || "")
    );

    $("ptPlanList").innerHTML = items.length
      ? items.map((p,i) => `
          <div class="pt-plan-item">
            <b>${esc(p.title)}</b>
            <div class="status">${esc(p.date || "No date")}</div>
            ${p.note ? `<p>${esc(p.note)}</p>` : ""}
            <button class="btn secondary" type="button"
              data-pt-delete-plan="${i}">Remove</button>
          </div>
        `).join("")
      : '<p class="status">No planned items yet.</p>';
  }

  function runDiagnostics() {
    const a = editorData();
    const issues = [];
    const text = plainText(a.content);
    const words = text.split(/\s+/).filter(Boolean).length;

    if (!a.title) {
      issues.push("Missing article title.");
    } else if (a.title.length > 70) {
      issues.push("Title exceeds 70 characters.");
    }

    if (!a.excerpt) {
      issues.push("Missing article excerpt.");
    } else if (a.excerpt.length > 160) {
      issues.push("Excerpt exceeds 160 characters.");
    }

    if (!text) issues.push("Article content is empty.");
    if (words > 0 && words < 250) {
      issues.push(`Article contains ${words} words; check whether it is complete.`);
    }

    if (a.cover) {
      try {
        const url = new URL(a.cover, location.href);
        if (!["http:","https:"].includes(url.protocol)) {
          issues.push("Cover image must use HTTP or HTTPS.");
        }
      } catch {
        issues.push("Cover image URL appears invalid.");
      }
    } else {
      issues.push("No cover image supplied (optional).");
    }

    if (/<img\b/i.test(a.content) &&
        /<img\b(?![^>]*\balt\s*=)[^>]*>/i.test(a.content)) {
      issues.push("At least one article image may be missing alt text.");
    }

    lastReport = issues.length
      ? "Publishing diagnostics:\n- " + issues.join("\n- ")
      : "No common issues detected. This basic check cannot guarantee SEO quality or database success.";

    $("ptDiagnosticsResult").textContent = lastReport;
    return lastReport;
  }

  function download(name, content, type="text/plain;charset=utf-8") {
    const url = URL.createObjectURL(new Blob([content], {type}));
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function copyText(text) {
    try {
      await navigator.clipboard.writeText(text);
      return true;
    } catch {
      return false;
    }
  }

  try {
    JSON.parse(localStorage.getItem(CHECK_KEY) || "[]").forEach(([key,value]) => {
      const box = card.querySelector(`[data-pt-check="${key}"]`);
      if (box) box.checked = Boolean(value);
    });
  } catch {}

  card.querySelectorAll("[data-pt-check]").forEach(box =>
    box.addEventListener("change", checklistUpdate)
  );
  checklistUpdate();

  $("ptRefreshStats").addEventListener("click", updateStats);

  ["blogTitle","blogExcerpt","blogContent","blogCover"].forEach(id =>
    $(id)?.addEventListener("input", updateStats)
  );

  updateStats();

  $("ptFocusEditor").addEventListener("click", () => {
    $("blogContent")?.scrollIntoView({behavior:"smooth",block:"center"});
    $("blogContent")?.focus();
  });

  $("ptAddPlan").addEventListener("click", () => {
    const title = $("ptPlanTitle").value.trim();

    if (!title) {
      $("ptPlanTitle").focus();
      return;
    }

    const items = plans();
    items.push({
      id: Date.now(),
      date: $("ptPlanDate").value,
      title,
      note: $("ptPlanNote").value.trim()
    });

    localStorage.setItem(PLAN_KEY, JSON.stringify(items));
    $("ptPlanTitle").value = "";
    $("ptPlanNote").value = "";
    renderPlans();
  });

  $("ptPlanList").addEventListener("click", event => {
    const button = event.target.closest("[data-pt-delete-plan]");
    if (!button) return;

    const items = plans().sort((a,b) =>
      (a.date || "").localeCompare(b.date || "")
    );

    items.splice(Number(button.dataset.ptDeletePlan), 1);
    localStorage.setItem(PLAN_KEY, JSON.stringify(items));
    renderPlans();
  });

  $("ptExportPlan").addEventListener("click", () =>
    download(
      "agootson-content-planner.json",
      JSON.stringify(plans(), null, 2),
      "application/json"
    )
  );

  renderPlans();

  $("ptRunDiagnostics").addEventListener("click", runDiagnostics);

  $("ptCopyReport").addEventListener("click", async () => {
    const report = lastReport || runDiagnostics();
    const copied = await copyText(report);

    if (copied) {
      $("ptDiagnosticsResult").textContent = "Report copied to clipboard.";
    } else {
      $("ptDiagnosticsResult").textContent =
        report + "\nClipboard unavailable. Select and copy this text.";
    }
  });

  $("ptBackupFile").addEventListener("change", async event => {
    const file = event.target.files?.[0];
    if (!file) return;

    try {
      const data = JSON.parse(await file.text());

      if (!data || typeof data !== "object" || Array.isArray(data)) {
        throw new Error("JSON root must be an object.");
      }

      const counts = Object.entries(data)
        .filter(([,value]) => Array.isArray(value))
        .map(([key,value]) => `${key}: ${value.length}`)
        .join(" · ");

      $("ptBackupResult").textContent =
        `Valid JSON (${Math.round(file.size / 1024)} KB). ` +
        (counts || "No record arrays detected.") +
        " No database changes were made.";
    } catch (error) {
      $("ptBackupResult").textContent =
        "Could not validate backup: " + error.message;
    }
  });

  $("ptPreviewImage").addEventListener("click", () => {
    const rawUrl = $("ptImageUrl").value.trim();
    const target = $("ptImagePreview");
    target.replaceChildren();

    if (!rawUrl) {
      target.textContent = "Enter an image URL first.";
      return;
    }

    let url;
    try {
      url = new URL(rawUrl, location.href);
    } catch {
      target.textContent = "Invalid image URL.";
      return;
    }

    if (!["http:","https:"].includes(url.protocol)) {
      target.textContent = "Only HTTP or HTTPS URLs are supported.";
      return;
    }

    const img = document.createElement("img");
    img.alt = "Cover image preview";
    img.src = url.href;

    img.onerror = () => {
      target.textContent = "Image could not load. Check the URL.";
    };

    target.appendChild(img);

    const caption = document.createElement("small");
    caption.textContent = url.href;
    target.appendChild(caption);
  });

  $("ptUseCover").addEventListener("click", () => {
    const field = $("blogCover");

    if (!field) {
      $("ptImagePreview").textContent =
        "Could not find the article cover field.";
      return;
    }

    field.value = $("ptImageUrl").value.trim();
    field.dispatchEvent(new Event("input", {bubbles:true}));
    updateStats();
  });

  $("ptSaveRecovery").addEventListener("click", () => {
    const data = {
      title: $("blogTitle")?.value || "",
      excerpt: $("blogExcerpt")?.value || "",
      content: $("blogContent")?.value || "",
      cover: $("blogCover")?.value || "",
      savedAt: new Date().toISOString()
    };

    localStorage.setItem(
      "agootson_admin_editor_recovery",
      JSON.stringify(data)
    );

    $("ptWorkflowStatus").textContent =
      "Recovery copy saved locally at " + new Date().toLocaleTimeString();
  });

  $("ptExportChecklist").addEventListener("click", () => {
    const items = [...card.querySelectorAll("[data-pt-check]")].map(box => ({
      task: box.parentElement.textContent.trim(),
      done: box.checked
    }));

    download(
      "agootson-publish-checklist.json",
      JSON.stringify({exportedAt:new Date().toISOString(),items}, null, 2),
      "application/json"
    );
  });
})();
</script>
